<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>메모 홈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --color-primary: #3182f6;
  --surface-page: #f2f4f6;
  --surface-card: #ffffff;
  --text-primary: #191f28;
  --text-secondary: #4e5968;
  --text-muted: #8b95a1;
  --text-on-primary: #ffffff;
  --label-blue-soft: #e8f3ff;
  --label-green-soft: #e3f8ec;
  --label-orange-soft: #fff1e5;
  --label-pink-soft: #ffeaf1;
  --space-4: 4px;
  --space-8: 8px;
  --space-12: 12px;
  --space-16: 16px;
  --space-20: 20px;
  --space-24: 24px;
  --space-34: 34px;
  --space-64: 64px;
  --radius-sm: 12px;
  --radius-md: 16px;
  --radius-xl: 24px;
  --radius-full: 999px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--surface-page);
  font-family: 'Noto Sans KR', sans-serif;
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; border: 0; background: none; color: inherit; cursor: pointer; text-align: inherit; }
.screen {
  width: 100%;
  max-width: 390px;
  min-height: 844px;
  margin: 0 auto;
  padding: var(--space-64) var(--space-16) var(--space-34);
  display: flex;
  flex-direction: column;
  gap: var(--space-16);
  background: var(--surface-page);
}
.main { flex: 1; display: flex; flex-direction: column; gap: var(--space-16); }
.header { display: flex; flex-direction: column; gap: var(--space-8); padding: 0 var(--space-8); }
.date { font-size: 15px; line-height: 22px; font-weight: 500; letter-spacing: -0.2px; color: var(--text-muted); }
.title { font-size: 28px; line-height: 38px; font-weight: 700; letter-spacing: -0.8px; word-break: keep-all; }
.title em { font-style: normal; color: var(--color-primary); }
.filter { display: flex; gap: var(--space-8); padding: 0 var(--space-4); }
.chip {
  height: 36px; padding: 0 var(--space-16);
  display: flex; align-items: center; flex-shrink: 0;
  border-radius: var(--radius-full);
  background: var(--surface-card); color: var(--text-secondary);
  font-size: 15px; line-height: 22px; font-weight: 700; letter-spacing: -0.2px; white-space: nowrap;
}
.chip.selected { background: var(--color-primary); color: var(--text-on-primary); }
.card { background: var(--surface-card); border-radius: var(--radius-xl); padding: var(--space-8) 0; display: flex; flex-direction: column; }
.card-header {
  height: 40px; display: flex; align-items: center; gap: var(--space-4);
  padding: var(--space-12) var(--space-16) var(--space-4) var(--space-20);
}
.card-header h2 { flex: 1; min-width: 0; font-size: 15px; line-height: 22px; font-weight: 700; letter-spacing: -0.2px; }
.card-header .action {
  display: flex; align-items: center; gap: var(--space-4);
  font-size: 15px; line-height: 22px; font-weight: 500; letter-spacing: -0.2px; color: var(--text-muted); white-space: nowrap;
}
.icon { display: block; flex-shrink: 0; }
.memo {
  width: 100%; height: 72px; display: flex; align-items: center; gap: var(--space-16);
  padding: var(--space-12) var(--space-20);
}
.tile { width: 44px; height: 44px; flex-shrink: 0; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; }
.tile.blue { background: var(--label-blue-soft); }
.tile.green { background: var(--label-green-soft); }
.tile.orange { background: var(--label-orange-soft); }
.tile.pink { background: var(--label-pink-soft); }
.memo-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--space-4); }
.memo-title { font-size: 17px; line-height: 24px; font-weight: 700; letter-spacing: -0.3px; color: var(--text-primary); }
.memo-preview { font-size: 14px; line-height: 20px; font-weight: 400; letter-spacing: -0.1px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.memo-date { flex-shrink: 0; font-size: 13px; line-height: 18px; font-weight: 500; color: var(--text-muted); white-space: nowrap; }
.btn-primary {
  position: sticky; bottom: var(--space-34);
  width: 100%; height: 56px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; gap: var(--space-8);
  padding: 0 var(--space-24); border-radius: var(--radius-md);
  background: var(--color-primary); color: var(--text-on-primary);
  font-size: 17px; line-height: 24px; font-weight: 700; letter-spacing: -0.2px;
}
</style>
</head>
